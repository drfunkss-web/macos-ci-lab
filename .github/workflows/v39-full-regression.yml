name: V3.9 full offline macOS regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v39-full-regression-${{ github.repository }}
  cancel-in-progress: false

jobs:
  regression:
    name: Pinned V3.9 macOS regression

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'drfunkss-web/macos-ci-lab' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'drfunkss-web' &&
      github.triggering_actor == 'drfunkss-web'

    runs-on: macos-15
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      JARVIS_DISABLE_LIVE_NVIDIA: '1'
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install fixed test dependencies before private checkout
        shell: bash
        run: |
          set -euo pipefail

          if python -m pip install --no-input \
            'pytest==9.1.1' \
            'openai==2.54.0' \
            'numpy==1.26.4' \
            'requests==2.34.2' \
            'PyYAML==6.0.3' \
            'opencv-contrib-python==4.11.0.86' \
            'mediapipe==0.10.21' \
            'ddgs==9.16.0' \
            'sounddevice==0.5.6' \
            'webrtcvad-wheels==2.0.14.post1' \
            'beautifulsoup4==4.15.0' \
            'PyAutoGUI==0.9.54' \
            > "$RUNNER_TEMP/dependencies.log" 2>&1
          then
            echo "REGRESSION_DEPENDENCIES_READY"
          else
            echo "REGRESSION_DEPENDENCY_INSTALL_FAILED"
            exit 1
          fi

      - name: Checkout pinned private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.CI_SOURCE_REPO }}
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: 35af7b8ca37bd7a85c699931edde3c66e99f67ca
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C source rev-parse HEAD)" = \
            "35af7b8ca37bd7a85c699931edde3c66e99f67ca"

          test -z "$(git -C source status --porcelain)"

          echo "V39_SOURCE_SHA_VERIFIED"

      - name: Execute offline regression suite
        working-directory: source
        shell: bash

        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
          NVIDIA_API_KEY: ''
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/jarvis-test-home"
          export HOME="$RUNNER_TEMP/jarvis-test-home"

          if python -m pytest tests \
            -q --tb=no --disable-warnings \
            -p no:cacheprovider \
            > "$RUNNER_TEMP/regression.log" 2>&1
          then
            echo "V39_FULL_REGRESSION_PASSED"
          else
            echo "V39_FULL_REGRESSION_FAILED"
            exit 1
          fi
