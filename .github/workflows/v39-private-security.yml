name: V3.9 offline security verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v39-security-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security:
    name: Pinned macOS security tests

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'drfunkss-web/macos-ci-lab' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'drfunkss-web' &&
      github.triggering_actor == 'drfunkss-web'

    runs-on: macos-15
    timeout-minutes: 12

    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      JARVIS_DISABLE_LIVE_NVIDIA: '1'
    steps:
      - name: Checkout pinned private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.CI_SOURCE_REPO }}
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: 35af7b8ca37bd7a85c699931edde3c66e99f67ca
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = \
            "35af7b8ca37bd7a85c699931edde3c66e99f67ca"
          test -z "$(git -C source status --porcelain)"
          echo "SOURCE_SHA_VERIFIED"

      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install fixed test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input \
            'pytest==9.1.1' \
            > "$RUNNER_TEMP/install.log" 2>&1 || {
              echo "DEPENDENCY_INSTALL_FAILED"
              exit 1
            }
          echo "TEST_DEPENDENCY_READY"

      - name: Execute offline security tests
        working-directory: source
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          set -euo pipefail

          if python -m pytest \
            tests/test_ci_candidate_guard_v39.py \
            tests/test_candidate_ci_v39.py \
            -q --tb=no --disable-warnings \
            -p no:cacheprovider \
            > "$RUNNER_TEMP/private-tests.log" 2>&1
          then
            echo "V39_SECURITY_TESTS_PASSED"
          else
            echo "V39_SECURITY_TESTS_FAILED"
            exit 1
          fi
