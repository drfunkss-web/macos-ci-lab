name: V3.9 live V3.8 candidate gate probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v39-live-v38-candidate-probe
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  JARVIS_DISABLE_LIVE_NVIDIA: '1'
  NVIDIA_API_KEY: ''
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  QT_QPA_PLATFORM: offscreen
  BASE_SHA: '30cbb6f2fb49d11a84636bc565f3fae0c391b23d'
  CANDIDATE_SHA: '047e820d41d8d1f7322a9c01658c40d726bce332'
  CANDIDATE_BRANCH: 'jarvis-review/v38-30cbb6f2fb49d11a'

jobs:
  candidate-gate:
    name: exact remote candidate guard and offline regression
    if: >-
      github.repository == 'drfunkss-web/macos-ci-lab' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'drfunkss-web'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install fixed dependencies before private checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input \
            'pytest==9.1.1' 'openai==2.54.0' 'numpy==1.26.4' \
            'requests==2.34.2' 'PyYAML==6.0.3' \
            'opencv-contrib-python==4.11.0.86' 'mediapipe==0.10.21' \
            'ddgs==9.16.0' 'sounddevice==0.5.6' \
            'webrtcvad-wheels==2.0.14.post1' 'beautifulsoup4==4.15.0' \
            'PyAutoGUI==0.9.54' > "$RUNNER_TEMP/v39-live-candidate-deps.log" 2>&1
          echo 'V39_LIVE_CANDIDATE_DEPENDENCIES_READY'

      - name: Checkout trusted main controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.CI_SOURCE_REPO }}
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ env.BASE_SHA }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false

      - name: Checkout exact remote V3.8 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.CI_SOURCE_REPO }}
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ env.CANDIDATE_BRANCH }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false

      - name: Verify immutable SHAs and trusted guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C trusted status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
          python trusted/tools/ci_candidate_guard_v39.py \
            --trusted-root "$GITHUB_WORKSPACE/trusted" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --sha "$CANDIDATE_SHA" \
            --branch "$CANDIDATE_BRANCH" \
            --base-sha "$BASE_SHA"
          echo 'V39_LIVE_CANDIDATE_GUARD_PASSED'

      - name: Run full fixed offline regression
        working-directory: candidate
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          set -euo pipefail
          if python -m pytest tests -q --tb=no --disable-warnings -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/v39-live-candidate.xml" \
            > "$RUNNER_TEMP/v39-live-candidate.log" 2>&1
          then
            python - "$RUNNER_TEMP/v39-live-candidate.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          counts = {key: sum(int(s.get(key, '0')) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          assert counts['tests'] > 0
          assert counts['failures'] == counts['errors'] == 0
          counts['passed'] = counts['tests'] - counts['skipped']
          print('V39_LIVE_CANDIDATE_COUNTS ' +
                ' '.join(key + '=' + str(value) for key, value in counts.items()))
          PY
          else
            echo 'V39_LIVE_CANDIDATE_REGRESSION_FAILED_DETAILS_WITHHELD'
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'V39_LIVE_CANDIDATE_REGRESSION_PASSED'

  evidence:
    name: clean evidence binding
    needs: candidate-gate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify result binding without candidate checkout
        shell: bash
        env:
          RESULT: ${{ needs.candidate-gate.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = 'success'
          test "$BASE_SHA" = '30cbb6f2fb49d11a84636bc565f3fae0c391b23d'
          test "$CANDIDATE_SHA" = '047e820d41d8d1f7322a9c01658c40d726bce332'
          test "$CANDIDATE_BRANCH" = 'jarvis-review/v38-30cbb6f2fb49d11a'
          echo 'V39_LIVE_CANDIDATE_EVIDENCE_BOUND'
