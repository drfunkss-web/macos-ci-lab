name: V3.9 final source freeze verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v39-final-source-freeze
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  JARVIS_DISABLE_LIVE_NVIDIA: '1'
  NVIDIA_API_KEY: ''
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  FINAL_SHA: '5559a9b71d320cccbf446e9bac8a43aacc189511'

jobs:
  full-regression:
    name: Final exact SHA full offline regression
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install fixed dependencies before private checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input \
            'pytest==9.1.1' 'openai==2.54.0' 'numpy==1.26.4' \
            'requests==2.34.2' 'PyYAML==6.0.3' \
            'opencv-contrib-python==4.11.0.86' 'mediapipe==0.10.21' \
            'ddgs==9.16.0' 'sounddevice==0.5.6' \
            'webrtcvad-wheels==2.0.14.post1' 'beautifulsoup4==4.15.0' \
            'PyAutoGUI==0.9.54' > "$RUNNER_TEMP/v39-final-deps.log" 2>&1
          echo 'V39_FINAL_DEPENDENCIES_READY'

      - name: Checkout exact private final SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.CI_SOURCE_REPO }}
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ env.FINAL_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false

      - name: Verify exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git -C source status --porcelain)"
          echo 'V39_FINAL_SOURCE_SHA_VERIFIED'

      - name: Typecheck merged camera helper
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -typecheck source/tools/list_cameras.swift
          echo 'V39_FINAL_CAMERA_SWIFT_TYPECHECK_PASSED'

      - name: Run final complete offline regression
        working-directory: source
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          set -euo pipefail
          if python -m pytest tests -q --tb=no --disable-warnings -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/v39-final.xml" \
            > "$RUNNER_TEMP/v39-final.log" 2>&1
          then
            python - "$RUNNER_TEMP/v39-final.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          counts = {key: sum(int(s.get(key, '0')) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          assert counts['tests'] > 0
          assert counts['failures'] == counts['errors'] == 0
          counts['passed'] = counts['tests'] - counts['skipped']
          print('V39_FINAL_COUNTS ' +
                ' '.join(key + '=' + str(value) for key, value in counts.items()))
          PY
            echo 'V39_FINAL_FULL_REGRESSION_PASSED'
          else
            echo 'V39_FINAL_FULL_REGRESSION_FAILED_DETAILS_WITHHELD'
            exit 1
          fi

  real-qt:
    name: Final exact SHA real Qt smoke
    runs-on: macos-15
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install fixed Qt test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input 'pytest==9.1.1' 'PySide6==6.9.2' \
            > "$RUNNER_TEMP/v39-final-qt-deps.log" 2>&1
          echo 'V39_FINAL_QT_DEPENDENCIES_READY'

      - name: Checkout exact private final SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.CI_SOURCE_REPO }}
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ env.FINAL_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false

      - name: Verify exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$FINAL_SHA"
          echo 'V39_FINAL_QT_SOURCE_SHA_VERIFIED'

      - name: Run two real Qt smoke tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if python -m pytest tests/test_real_qt_smoke_v35.py -q --tb=no \
            -p no:cacheprovider > "$RUNNER_TEMP/v39-final-qt.log" 2>&1
          then
            grep -Eq '(^|[[:space:]])2 passed([[:space:]]|$)' "$RUNNER_TEMP/v39-final-qt.log"
            echo 'V39_FINAL_REAL_QT_TWO_TESTS_PASSED'
          else
            echo 'V39_FINAL_REAL_QT_FAILED_DETAILS_WITHHELD'
            exit 1
          fi
