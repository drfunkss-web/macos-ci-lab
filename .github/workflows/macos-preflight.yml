name: Manual macOS preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  macos-preflight:
    name: macOS environment only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'drfunkss-web/macos-ci-lab' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'drfunkss-web' &&
      github.triggering_actor == 'drfunkss-web'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Verify macOS and Python environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          echo 'MACOS_PREFLIGHT_STARTED'
          sw_vers
          uname -m
          python3 --version
          echo 'MACOS_PREFLIGHT_PASSED'
